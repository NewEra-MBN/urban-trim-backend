name: CI

# WHEN: every push to any branch, and every PR into main
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test:
    # WHERE: a fresh Linux machine from GitHub
    runs-on: ubuntu-latest

    # An empty Postgres running next to the machine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urbantrim_test
        ports:
          - 5432:5432
        # Wait until Postgres can accept connections before running steps
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Replaces the .env file (which is not in git). Test-only values, not real secrets.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/urbantrim_test
      JWT_SECRET: ci-test-jwt-secret
      SUPER_ADMIN_JWT_SECRET: ci-test-super-admin-secret

    # WHAT: the to-do list, top to bottom
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations
        run: npm run migrate:deploy

      - name: Run tests
        run: npm test
